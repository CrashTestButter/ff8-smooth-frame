name: release

# Annotated tag v*: the tag message becomes the release notes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PYTHON: python
        run: tools/release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: FF8SmoothFrames
          path: |
            dist/FF8SmoothFrames.iroj
            dist/FF8SmoothFrames.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/FF8SmoothFrames.iroj dist/FF8SmoothFrames.zip --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
