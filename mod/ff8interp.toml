# FF8 Smooth Frames settings. In Junction VIII, set these in Configure Mod instead of editing this file.
# The game keeps its normal speed; the fps values only set how many frames per second are shown
# (30 to 1000). With vsync on, the display's refresh rate is the upper limit.

# Battles
ff8_battle_anim_interp = true
ff8_battle_fps = 144

# World map
ff8_world_interp = true
ff8_world_fps = 144

# Fields (towns, dungeons)
ff8_field_interp = true
ff8_field_fps = 144

# true: one status line per second in ff8interp.log. Turn on when reporting a problem.
ff8interp_diag = false
